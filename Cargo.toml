[package]
name = "skyhop"
version = "0.1.0"
edition = "2021"
description = "A small, friendly flight sim for learning the basics of flying"

[dependencies]
macroquad = { version = "0.4.16", default-features = false, features = ["audio"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
